services:
  email-assistant:
    build: .
    container_name: email_assistant
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./backend/app/static:/app/backend/app/static
    restart: unless-stopped
    networks:
      - assistant-net

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n_automator
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=America/Bogota
    volumes:
      - n8n_data:/home/node/.n8n
    restart: unless-stopped
    depends_on:
      - email-assistant
    networks:
      - assistant-net

volumes:
  n8n_data:

networks:
  assistant-net:
    driver: bridge
